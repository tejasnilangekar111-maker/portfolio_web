name: Deploy portfolio to GitHub Pages

on:
  # Deploy on every push to main
  push:
    branches: [main]
  # Allow running manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel one that is in progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          for f in index.html style.css script.js Tejas_Resume.pdf; do
            test -f "$f" || { echo "::error::Missing $f"; exit 1; }
          done

      - name: Collect site files
        # Publish only the website, not README, workflows or other repo files
        run: |
          mkdir _site
          cp index.html style.css script.js Tejas_Resume.pdf _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
